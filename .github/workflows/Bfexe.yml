name: Inspect APK
on: workflow_dispatch

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Download APK from release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download mobile-legacy --repo ${{ github.repository }} --pattern "*.apk" --dir /tmp/dl
          ls -la /tmp/dl

      - name: Inspect native libs
        run: |
          APK=$(ls /tmp/dl/*.apk | head -1)
          mkdir -p /tmp/apk && unzip -q "$APK" -d /tmp/apk
          ls -la /tmp/apk/lib/arm64-v8a/
          for f in /tmp/apk/lib/arm64-v8a/*.so; do
            echo "== $f"
            readelf --dyn-syms "$f" | grep __emutls_get_address || true
          done
